server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Cabeçalhos de segurança: impede abrir o site dentro de outro (clickjacking), carregar scripts de
  # fora e vazar o endereço da página (que traz o token do link de cancelamento) para outros sites.
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

  location /api/ {
    proxy_pass http://api:3000;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location /assets/ {
    expires 1y; # (sem add_header aqui: no nginx ele apagaria os cabeçalhos de segurança acima)
    try_files $uri =404;
  }

  # Rotas do React (ex.: /admin, /agendamento/1): sempre devolve o index.html.
  location / {
    try_files $uri /index.html;
  }
}
